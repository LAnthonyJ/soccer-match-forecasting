<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Cup Forecasts</title>
  <link rel="stylesheet" href="/h5/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand">World Cup Forecasts</div>
        <div class="subbrand">Probabilities, scorelines, goal totals and pre-match signals</div>
      </div>
      <button id="accountButton" class="icon-button" aria-label="Account">Account</button>
    </header>

    <main id="app" class="main-view">
      <section class="loading-view">Loading...</section>
    </main>

    <nav class="bottom-nav">
      <button data-route="#/search">Predictions</button>
      <button data-route="#/matches">Matches</button>
      <button data-route="#/account">Account</button>
    </nav>
  </div>
  <script src="/h5/runtime-config.js"></script>
  <script type="module" src="/h5/app.js"></script>
</body>
</html>
