name: Verify open release
on:
  push:
    paths-ignore:
      - '.github/epl-public-data-sha'
  pull_request:
    paths-ignore:
      - '.github/epl-public-data-sha'
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements.lock .
      - run: python -m unittest discover -s tests -v
      - name: Smoke test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -c "from epl_agent.web import create_app; c=create_app().test_client(); assert c.get('/').status_code==200; d=c.get('/api/dashboard').json; p=c.get('/api/fixtures/'+d['default_id']).json['prediction']; assert abs(sum(p['a'])-1)<1e-6"
      - run: python scripts/check_release.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -c requirements.lock .
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
