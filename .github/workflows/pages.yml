name: Publish replay dashboard
on:
  workflow_dispatch:
  push:
    branches: [main, epl-v1]
  schedule:
    - cron: "23 */3 * * *"
permissions:
  contents: read
  issues: read
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    env:
      EXPECTED_ISSUE: ${{ github.repository == 'LAnthonyJ/worldcup_prediction' && '1' || vars.EPL_EVIDENCE_ISSUE }}
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -c requirements.lock .
      - name: Resolve one public data commit
        id: data
        run: |
          set -euo pipefail
          head=$(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/public-data)
          sha="${head%%[[:space:]]*}"
          if [[ -f .github/epl-public-data-sha ]]; then
            [[ -n "$sha" ]] || { echo 'Previously published data branch is missing'; exit 1; }
            sha=$(cat .github/epl-public-data-sha)
          fi
          if [[ -n "$sha" ]]; then
            [[ "$sha" =~ ^[0-9a-f]{40}$ && "$EXPECTED_ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo 'A public-data commit and the expected evidence issue are required together'; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Read public inputs at pinned SHA
        if: steps.data.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.data.outputs.sha }}
          path: incoming
          persist-credentials: false
          sparse-checkout: |
            /snapshot.json
          sparse-checkout-cone-mode: false
      - name: Verify witnesses, rebuild scores and export official site
        if: steps.data.outputs.sha != ''
        env:
          EPL_EVIDENCE_REPO: ${{ github.repository }}
          EPL_EVIDENCE_ISSUE: ${{ env.EXPECTED_ISSUE }}
          EPL_AUDIT_GITHUB_TOKEN: ${{ github.token }}
          SNAPSHOT_SHA: ${{ steps.data.outputs.sha }}
        run: |
          python -m epl_agent export site --snapshot incoming
          echo "$SNAPSHOT_SHA" > site/public-data-commit.txt
      - name: Build standalone historical demo
        if: steps.data.outputs.sha == ''
        env:
          EPL_AUDIT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$EXPECTED_ISSUE" ]]; then
            export EPL_EVIDENCE_REPO="$GITHUB_REPOSITORY" EPL_EVIDENCE_ISSUE="$EXPECTED_ISSUE"
            python -m epl_agent snapshot export "${RUNNER_TEMP}/initial-data"
            python -m epl_agent export site --snapshot "${RUNNER_TEMP}/initial-data"
          else
            python -m epl_agent export site
          fi
      - name: Prepare optional public analysis host
        if: vars.EPL_CF_PAGES_PROJECT != '' && steps.data.outputs.sha != ''
        run: python scripts/analysis_release.py cloud site
      - uses: actions/setup-node@v4
        if: vars.EPL_CF_PAGES_PROJECT != '' && steps.data.outputs.sha != ''
        with:
          node-version: 24
      - name: Publish the same verified batch to the configured free Cloudflare project
        id: analysis
        if: vars.EPL_CF_PAGES_PROJECT != '' && steps.data.outputs.sha != ''
        continue-on-error: true
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          EPL_CF_PAGES_PROJECT: ${{ vars.EPL_CF_PAGES_PROJECT }}
          EPL_PRICING_VALID_UNTIL: ${{ vars.EPL_PRICING_VALID_UNTIL }}
        run: |
          set -euo pipefail
          npm ci
          npm run configure
          npx --no-install wrangler d1 migrations apply DB --remote
          npx --no-install wrangler pages deploy site --project-name "$EPL_CF_PAGES_PROJECT" --branch epl-v1
      - name: Recover published reports and warm the verified round
        if: vars.EPL_CF_PAGES_PROJECT != '' && steps.data.outputs.sha != ''
        env:
          EPL_CF_PAGES_PROJECT: ${{ vars.EPL_CF_PAGES_PROJECT }}
          EPL_PREVIOUS_PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SNAPSHOT_SHA: ${{ steps.data.outputs.sha }}
          DEPLOY_OUTCOME: ${{ steps.analysis.outcome }}
        run: |
          set -euo pipefail
          [[ "$EPL_CF_PAGES_PROJECT" =~ ^[a-z0-9-]+$ ]]
          export EPL_ANALYSIS_ORIGIN="https://${EPL_CF_PAGES_PROJECT}.pages.dev"
          warm=()
          if [[ "$DEPLOY_OUTCOME" == success ]]; then
            for attempt in {1..10}; do
              if [[ "$(curl -fsS --max-time 5 "$EPL_ANALYSIS_ORIGIN/public-data-commit.txt" || true)" == "$SNAPSHOT_SHA" ]]; then warm=(--warm); break; fi
              sleep 3
            done
          fi
          if (( ${#warm[@]} == 0 )); then echo '::warning::Analysis deployment has not confirmed this public batch. Keeping the read-only replay available.'; fi
          python scripts/analysis_release.py mirror site "${warm[@]}"
      - uses: actions/upload-pages-artifact@v3
        id: artifact
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm the verified build artifact is available
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                --jq ".artifacts[] | select(.id==$ARTIFACT_ID and .name==\"github-pages\" and .expired==false) | .id" | grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 5
          done
          echo "The audited Pages artifact is unavailable."
          exit 1
      - name: Deploy checked site
        id: deployment
        uses: actions/deploy-pages@v4
